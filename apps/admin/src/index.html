<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AlMadina Uraan Group</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes"
    />
    <script>
      (function () {
        var width = 1280;
        var screenWidth = screen.width || window.innerWidth || width;
        if (screenWidth >= width) return;
        var scale = Math.max(0.2, screenWidth / width);
        var meta = document.querySelector('meta[name="viewport"]');
        if (meta) {
          meta.setAttribute(
            'content',
            'width=' +
              width +
              ', initial-scale=' +
              scale +
              ', minimum-scale=0.15, maximum-scale=5, user-scalable=yes',
          );
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
