<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AlMadina Uraan Group</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=1280, user-scalable=yes, minimum-scale=0.1, maximum-scale=5"
    />
    <script>
      (function () {
        var width = 1280;
        var meta = document.querySelector('meta[name="viewport"]');
        if (meta) {
          meta.setAttribute(
            'content',
            'width=' + width + ', user-scalable=yes, minimum-scale=0.1, maximum-scale=5',
          );
        }
        var innerWidth = window.innerWidth || width;
        if (innerWidth < width) {
          document.documentElement.style.zoom = String(Math.max(0.2, innerWidth / width));
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
