services:
  postgres:
    image: postgres:16-alpine
    container_name: kabootar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kabootar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kabootar_secret}
      POSTGRES_DB: ${POSTGRES_DB:-kabootar}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kabootar}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: kabootar-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-kabootar}:${POSTGRES_PASSWORD:-kabootar_secret}@postgres:5432/${POSTGRES_DB:-kabootar}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:3001}
    ports:
      - '${API_PORT:-3000}:3000'

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: kabootar-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
    ports:
      - '${WEB_PORT:-3001}:3001'

volumes:
  postgres_data:
