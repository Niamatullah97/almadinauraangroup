upstream kabootar_api {
  server api:3000;
}

upstream kabootar_web {
  server web:3001;
}

upstream kabootar_admin {
  server admin:80;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://kabootar_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://kabootar_api;
    proxy_set_header Host $host;
  }

  location /admin/ {
    proxy_pass http://kabootar_admin/;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://kabootar_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
